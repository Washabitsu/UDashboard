server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Files under /assets have a hash in their name, so they never change: the browser may keep them
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Every other path is a route inside the React app: answer with index.html and let the app decide.
    # index.html itself is always checked for a new version
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
